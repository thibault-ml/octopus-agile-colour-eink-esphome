    id: ha_time


sensor:
  - platform: wifi_signal # Reports the WiFi signal strength/RSSI in dB
    update_interval: 45s
    name: "WiFi Signal dB"
    id: wifi_signal_db
    unit_of_measurement: "dB"
    entity_category: "diagnostic"

  - platform: copy # Reports the WiFi signal strength in %
    source_id: wifi_signal_db
    name: "WiFi Signal Percent"
    id: wifi_signal_percent
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "%"
    entity_category: "diagnostic"

  - platform: sht4x
    update_interval: 45s
    temperature:
      name: "Temperature"
      id: temperature
    humidity:
      name: "Relative Humidity"
      id: humidity

  - platform: adc
    pin: GPIO1
    id: battery_voltage
    name: "Battery Voltage"
    attenuation: 12db
    update_interval: 45s
    filters:
      - multiply: 2.0  # Adjust based on voltage divider (if present)

  - platform: template
    name: "Battery Percentage"
    id: battery_percent
    unit_of_measurement: "%"
    accuracy_decimals: 0
    state_class: measurement
    device_class: battery
    update_interval: 45s
    lambda: |-
      // Read battery voltage
      float voltage = id(battery_voltage).state;

      // Calibrated from observed discharge:
      //   4.15V = 100% (max charge observed)
      //   3.40V =   6% (knee: 31 of 33 days consumed above this point)
      //   2.50V =   0% (min observed before rapid degradation)
      float percentage;

      if (voltage >= 4.15) {
        percentage = 100.0;
      } else if (voltage >= 3.4) {
        percentage = 6.0 + (voltage - 3.4) * (94.0 / 0.75);  // 3.4-4.15V = 6-100%
      } else if (voltage >= 2.5) {
        percentage = (voltage - 2.5) * (6.0 / 0.9);           // 2.5-3.4V  = 0-6%
      } else {
        percentage = 0.0;
      }

      return percentage;

  - platform: homeassistant
    id: octopus_current_rate
    entity_id: sensor.octopus_energy_electricity_22l4134239_1200031450010_current_rate
    # on_value:
    #   then:
    #     - component.update: epaper_display

  - platform: homeassistant
    id: octopus_fixed_rate
    entity_id: sensor.flexible_octopus_electricity_unit_rate_gbp_kwh

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO3
      mode: INPUT_PULLUP
      inverted: true
    name: "Refresh Button"
    on_press:
      - logger.log:
          tag: "refresh"
          format: "Refresh button pressed - updating battery and display"
          level: INFO
      - component.update: battery_voltage
      - component.update: battery_percent
      - component.update: epaper_display

  - platform: gpio
    pin:
      number: GPIO5
      mode: INPUT_PULLUP
      inverted: true
    name: "Deep Sleep Toggle Button"
    on_press:
      - lambda: |-
          // Toggle the prevent_deep_sleep global variable
          id(prevent_deep_sleep) = !id(prevent_deep_sleep);

          if (id(prevent_deep_sleep)) {
            ESP_LOGI("deep_sleep", "Button pressed - deep sleep prevention enabled");
            id(deep_sleep_config).prevent_deep_sleep();
          } else {
            ESP_LOGI("deep_sleep", "Button pressed - deep sleep prevention disabled, will sleep in 2 minutes");
            id(deep_sleep_config).allow_deep_sleep();
          }
      - if:
          condition:
            lambda: 'return !id(prevent_deep_sleep);'
          then:
            - delay: 1min
            - script.execute: enter_deep_sleep_until_next_wakeup

text_sensor:
  - platform: homeassistant
    id: octopus_rates
    entity_id: sensor.octopus_rates_json
    attribute: rates_json
    # on_value:
    #   then:
    #     - component.update: epaper_display

  - platform: homeassistant
    id: octopus_next_rates
    entity_id: sensor.octopus_next_rates_json
    attribute: rates_json

  - platform: template
    name: "Wakeup Cause"
    id: wakeup_cause
    icon: "mdi:sleep"
    lambda: |-
      auto wakeup_reason = esp_sleep_get_wakeup_cause();

      switch(wakeup_reason) {
        case ESP_SLEEP_WAKEUP_UNDEFINED: return {"Undefined (not deep sleep exit)"};
        case ESP_SLEEP_WAKEUP_EXT0: return {"External signal (RTC_IO)"};
        case ESP_SLEEP_WAKEUP_EXT1: return {"External signal (RTC_CNTL)"};
        case ESP_SLEEP_WAKEUP_TIMER: return {"Timer"};
        case ESP_SLEEP_WAKEUP_TOUCHPAD: return {"Touchpad"};
        case ESP_SLEEP_WAKEUP_ULP: return {"ULP program"};
        case ESP_SLEEP_WAKEUP_GPIO: return {"GPIO"};
        case ESP_SLEEP_WAKEUP_UART: return {"UART"};
        case ESP_SLEEP_WAKEUP_WIFI: return {"WiFi"};
        case ESP_SLEEP_WAKEUP_COCPU: return {"COCPU"};
        case ESP_SLEEP_WAKEUP_COCPU_TRAP_TRIG: return {"COCPU crash"};
        case ESP_SLEEP_WAKEUP_BT: return {"Bluetooth"};
        default: return {"Power on or reset"};
      }

switch:
  - platform: template
    name: "Prevent Deep Sleep"
    id: prevent_deep_sleep_switch
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - globals.set:
          id: prevent_deep_sleep
          value: 'true'
      - deep_sleep.prevent: deep_sleep_config
      - logger.log: "Deep sleep prevented"
    turn_off_action:
      - globals.set:
          id: prevent_deep_sleep
          value: 'false'
      - deep_sleep.allow: deep_sleep_config
      - logger.log: "Deep sleep allowed: will sleep in 1 minute"
      - delay: 1min
      - script.execute: enter_deep_sleep_until_next_wakeup

script:
  - id: enter_deep_sleep_until_next_wakeup
    then:
      - lambda: |-
          if (id(prevent_deep_sleep)) {
            ESP_LOGI("enter_deep_sleep", "Deep sleep prevented by user");
            return;
          }

          auto time = id(ha_time).now();
          if (!time.is_valid()) {
            ESP_LOGW("enter_deep_sleep", "Time not synced.");
            return;
          }

          int current_minute = time.minute;
          int current_second = time.second;

          // Calculate seconds until next target time (00:55 or 30:55)
          int target_minute;
          int target_second = 59;

          if (current_minute < 30 || (current_minute == 30 && current_second < target_second)) {
            target_minute = 30;
          } else {
            target_minute = 0;  // Next hour
          }

          int minutes_until_target;
          if (target_minute > current_minute) {
            minutes_until_target = target_minute - current_minute;
          } else {
            minutes_until_target = 60 - current_minute + target_minute;
          }

          int seconds_until_target = (minutes_until_target * 60) - current_second + target_second;

          ESP_LOGI("enter_deep_sleep", "Current time: %02d:%02d:%02d", time.hour, current_minute, current_second);
          ESP_LOGI("enter_deep_sleep", "Next wakeup in %d seconds (at :%02d:%02d)", seconds_until_target, target_minute, target_second);

          // Enter deep sleep for calculated duration (convert to milliseconds)
          id(deep_sleep_config).set_sleep_duration(seconds_until_target * 1000);
          id(deep_sleep_config).dump_config();
          id(deep_sleep_config).begin_sleep();

display:
  - platform: epaper_spi
    id: epaper_display
    model: Seeed-reTerminal-E1002
    update_interval: never
    lambda: |-
      #include <ArduinoJson.h>

      // E-Ink Spectra 6 colors (native palette)
      #define COLOR_BLACK Color(0, 0, 0)
      #define COLOR_WHITE Color(255, 255, 255)
      #define COLOR_RED Color(255, 0, 0)
      #define COLOR_YELLOW Color(255, 255, 0)
      #define COLOR_GREEN Color(0, 255, 0)
      #define COLOR_BLUE Color(0, 0, 255)

      // Bar colours
      // Primary
      #define BAR_COLOR_BLACK COLOR_BLACK, COLOR_BLACK
      #define BAR_COLOR_WHITE COLOR_WHITE, COLOR_WHITE
      #define BAR_COLOR_RED COLOR_RED, COLOR_RED
      #define BAR_COLOR_YELLOW COLOR_YELLOW, COLOR_YELLOW
      #define BAR_COLOR_GREEN COLOR_GREEN, COLOR_GREEN
      #define BAR_COLOR_BLUE COLOR_BLUE, COLOR_BLUE
      // Secondary
      #define BAR_COLOR_ORANGE COLOR_RED, COLOR_YELLOW
      #define BAR_COLOR_LIGHT_BLUE COLOR_BLUE, COLOR_WHITE
      #define BAR_COLOR_LIGHT_GREEN COLOR_GREEN, COLOR_WHITE
      #define BAR_COLOR_TEAL COLOR_GREEN, COLOR_BLUE
      #define BAR_COLOR_LIGHT_RED COLOR_RED, COLOR_WHITE
      #define BAR_COLOR_DARK_RED COLOR_RED, COLOR_BLACK
      #define BAR_COLOR_PURPLE COLOR_BLUE, COLOR_RED
      #define BAR_COLOR_PALE_YELLOW COLOR_YELLOW, COLOR_WHITE
      #define BAR_COLOR_BROWN COLOR_GREEN, COLOR_RED

      // UI colors
      #define COLOR_CURRENT COLOR_ORANGE
      #define COLOR_GRID COLOR_BLACK
      #define COLOR_TEXT COLOR_BLACK
      #define COLOR_BG COLOR_WHITE

      // Graph dimensions
      const int graph_x = 60;
      const int graph_y = 60;
      const int graph_width = 680;
      const int graph_height = 360;

      // Helper function to draw bar with optional checkerboard pattern
      auto draw_bar = [&](int x, int y, int width, int height, Color color1, Color color2) {
        if (color1 == color2) {
          // Both colors are the same, use filled rectangle
          it.filled_rectangle(x, y, width, height, color1);
        } else {
          // Draw checkerboard pattern
          for (int py = y; py < y + height; py++) {
            for (int px = x; px < x + width; px++) {
              Color pixel_color = ((px + py) % 2 == 0) ? color1 : color2;
              it.draw_pixel_at(px, py, pixel_color);
            }
          }
        }
      };

      // Get current time
      auto time = id(ha_time).now();
      int current_hour = time.hour;
      int current_minute = time.minute;
      time_t now_epoch = time.timestamp;

      // Get and validate rates JSON
      std::string rates_json = id(octopus_rates).state;
      std::string next_rates_json = id(octopus_next_rates).state;
      ESP_LOGD("display.lambda", "JSON rates data: %s", rates_json.c_str());
      ESP_LOGD("display.lambda", "JSON next day rates data: %s", next_rates_json.c_str());

      if (rates_json.empty()) {
        it.printf(400, 240, id(font_regular), COLOR_TEXT, TextAlign::CENTER,
                 "Waiting for rates data...");
        ESP_LOGD("display.lambda", "No rates data available yet, skipping display update");
        return;
      }

      // Rate periods from today's and tomorrow's rates, placed by their UTC start time
      struct RateSlot {
        time_t start;     // UTC epoch
        int local_date;   // YYYYMMDD, as written in the timestamp
        float value_inc_vat;
      };
      const int max_slots = 128;
      const int slot_seconds = 30 * 60;
      static RateSlot slots[max_slots];
      int num_slots = 0;

      // Parse "YYYY-MM-DDTHH:MM:SS+HH:MM" using its UTC offset, so the repeated hour when
      // the clocks go back (and the skipped one when they go forward) is handled
      auto parse_start = [](const char* s, time_t* epoch, int* local_date) -> bool {
        int year, month, day, hour, minute, second, offset_hours = 0, offset_minutes = 0;
        char sign = 'Z';
        if (!s || sscanf(s, "%d-%d-%dT%d:%d:%d%c%d:%d", &year, &month, &day, &hour, &minute,
                         &second, &sign, &offset_hours, &offset_minutes) < 6 ||
            month < 1 || month > 12) {
          return false;
        }

        // Days since 1970-01-01 (good until 2100)
        static const int days_before_month[] = {0, 31, 59, 90, 120, 151, 181, 212, 243, 273, 304, 334};
        int64_t days = (int64_t)(year - 1970) * 365 + (year - 1969) / 4 +
                       days_before_month[month - 1] + day - 1;
        if (month > 2 && year % 4 == 0) days++;

        int offset = offset_hours * 3600 + offset_minutes * 60;
        if (sign == '-') offset = -offset;
        else if (sign != '+') offset = 0;

        *epoch = (time_t)(days * 86400 + hour * 3600 + minute * 60 + second - offset);
        *local_date = year * 10000 + month * 100 + day;
        return true;
      };

      // Add a JSON array of rates to slots. A period in both lists (e.g. stale next day
      // rates just after midnight) is only kept once
      JsonDocument doc;
      auto add_rates = [&](const std::string& json) -> bool {
        DeserializationError error = deserializeJson(doc, json);
        if (error) {
          ESP_LOGE("display.lambda", "JSON parsing failed: %s", error.c_str());
          return false;
        }

        for (JsonObject rate : doc.as<JsonArray>()) {
          const char* start_time = rate["start"];
          float value_inc_vat = rate["value_inc_vat"];
          time_t start;
          int local_date;
          if (!parse_start(start_time, &start, &local_date)) continue;

          int i = 0;
          while (i < num_slots && slots[i].start != start) i++;
          if (i == num_slots) {
            if (num_slots == max_slots) break;
            num_slots++;
          }
          slots[i].start = start;
          slots[i].local_date = local_date;
          slots[i].value_inc_vat = value_inc_vat;
        }
        return true;
      };

      if (!add_rates(rates_json)) {
        it.printf(400, 240, id(font_regular), COLOR_TEXT, TextAlign::CENTER,
                 "Error parsing rates data");
        return;
      }

      // Tomorrow's rates are optional: they're usually published around 4-5pm
      if (!next_rates_json.empty() && !add_rates(next_rates_json)) {
        ESP_LOGW("display.lambda", "Ignoring next day rates");
      }

      if (num_slots == 0) {
        it.printf(400, 240, id(font_regular), COLOR_TEXT, TextAlign::CENTER,
                 "No rate periods found");
        ESP_LOGE("display.lambda", "No rate periods found in data");
        return;
      }

      // All validation passed - draw the graph!

      // Clear background first
      // it.fill(COLOR_BG);

      // STEP 0: Pick the time window to draw
      // Normally the whole of the last day we have rates for (i.e. today). Once tomorrow's
      // rates are in, it runs from the current period to the last known one instead.
      time_t last_start = slots[0].start;
      int last_date = slots[0].local_date;
      for (int i = 1; i < num_slots; i++) {
        if (slots[i].start > last_start) {
          last_start = slots[i].start;
          last_date = slots[i].local_date;
        }
      }
      time_t last_day_start = last_start;
      for (int i = 0; i < num_slots; i++) {
        if (slots[i].local_date == last_date && slots[i].start < last_day_start) {
          last_day_start = slots[i].start;
        }
      }

      time_t window_end = last_start + slot_seconds;
      time_t window_start = last_day_start;
      time_t current_slot_start = now_epoch - (now_epoch % slot_seconds);
      if (time.is_valid() && current_slot_start < window_start) {
        window_start = current_slot_start;
      }
      if (window_end - window_start > (time_t)max_slots * slot_seconds) {
        window_start = window_end - (time_t)max_slots * slot_seconds;
      }
      bool showing_next_day = window_start < last_day_start;

      // STEP 1: Find min and max (within the window) for graph scaling
      float min_rate = 999.0;
      float max_rate = 0.0;

      for (int i = 0; i < num_slots; i++) {
        if (slots[i].start < window_start || slots[i].start >= window_end) continue;
        float value = slots[i].value_inc_vat;
        if (value < min_rate) min_rate = value;
        if (value > max_rate) max_rate = value;
      }

      float range = max_rate - min_rate;

      // Y-axis: start at 0 if all values are positive, otherwise start at lowest value
      float display_min = (min_rate >= 0) ? 0.0 : min_rate - (range * 0.1);
      float display_max = max_rate + (range * 0.1);
      float display_range = display_max - display_min;

      // STEP 2: Draw grid lines
      // Y-axis: horizontal lines at 5p increments
      float y_increment = 0.05;
      float y_start = floor(display_min / y_increment) * y_increment;

      for (float price = y_start; price <= display_max + 0.001; price += y_increment) {
        if (price < display_min - 0.001) continue;  // Skip values below display range

        int y = graph_y + graph_height - (int)((price - display_min) / display_range * graph_height);
        it.line(graph_x, y, graph_x + graph_width, y, COLOR_GRID);
        it.printf(graph_x - 8, y - 7, id(font_small), COLOR_TEXT, TextAlign::TOP_RIGHT,
                 "%dp", (int)roundf(price * 100));
      }

      // One bar per half-hour period in the window (more or fewer than 48 when the clocks change)
      const int total_bars = (window_end - window_start) / slot_seconds;
      float bar_width = (float)graph_width / total_bars;

      // X-axis: vertical lines every 2 hours of local time
      int hours_per_line = 2;
      for (int index = 0; index <= total_bars; index++) {
        ESPTime local = ESPTime::from_epoch_local(window_start + (time_t)index * slot_seconds);
        if (local.minute != 0 || local.hour % hours_per_line != 0) continue;

        int x_pos = graph_x + graph_width * index / total_bars;
        it.line(x_pos, graph_y, x_pos, graph_y + graph_height, COLOR_GRID);
        // A midnight-to-midnight window ends at "24:00" rather than "00:00"
        int label_hour = (index == total_bars && local.hour == 0) ? 24 : local.hour;
        it.printf(x_pos, graph_y + graph_height + 9, id(font_small),
                 COLOR_TEXT, TextAlign::CENTER, "%02d:00", label_hour);
      }

      // STEP 3: Draw the rate bars with color coding
      float current_rate = 0.0;  // Track current rate for display

      // Y position of the zero line (bottom of graph when all rates are positive)
      int zero_y = graph_y + graph_height - (int)((0.0f - display_min) / display_range * graph_height);

      for (int i = 0; i < num_slots; i++) {
        if (slots[i].start < window_start || slots[i].start >= window_end) continue;

        float value_inc_vat = slots[i].value_inc_vat;
        int index = (slots[i].start - window_start) / slot_seconds;

        // Calculate if this is the current period
        bool is_current = time.is_valid() && now_epoch >= slots[i].start &&
                          now_epoch < slots[i].start + slot_seconds;

        if (is_current) {
          current_rate = value_inc_vat;
        }

        // Bars are anchored at the zero line: positive bars go up, negative bars go down
        int bar_x = graph_x + (int)(index * bar_width) + 1;
        int bar_y, bar_height;
        if (value_inc_vat >= 0) {
          bar_height = (int)(value_inc_vat / display_range * graph_height);
          bar_y = zero_y - bar_height;
        } else {
          bar_height = (int)((-value_inc_vat) / display_range * graph_height);
          bar_y = zero_y;
        }

        // Highlight current period with arrow and dashed line (drawn first so bar goes over it)
        if (is_current) {
          int center_x = bar_x + (int)bar_width / 2;
          int arrow_y = graph_y - 15;
          int arrow_width = 12;
          int arrow_height = 10;

          // Draw filled triangle pointing down
          it.filled_triangle(
            center_x - arrow_width, arrow_y,
            center_x + arrow_width, arrow_y,
            center_x, arrow_y + arrow_height,
            COLOR_BLACK
          );

          // Draw dashed vertical line from arrow to bottom of graph
          int line_start = arrow_y + arrow_height;
          int line_end = graph_y + graph_height;
          int dash_length = 5;
          int gap_length = 3;

          for (int y = line_start; y < line_end; y += dash_length + gap_length) {
            int dash_end = y + dash_length;
            if (dash_end > line_end) dash_end = line_end;
            it.line(center_x, y, center_x, dash_end, COLOR_BLACK);
          }
        }

        // Draw bar with color based on rate (7 tiers)
        float value_pence = value_inc_vat * 100;

        if (value_pence < 0) {
          draw_bar(bar_x, bar_y, (int)bar_width - 1, bar_height, BAR_COLOR_TEAL);
        } else if (value_pence < 10) {
          draw_bar(bar_x, bar_y, (int)bar_width - 1, bar_height, BAR_COLOR_LIGHT_BLUE);
        } else if (value_pence < 20) {
          draw_bar(bar_x, bar_y, (int)bar_width - 1, bar_height, BAR_COLOR_LIGHT_GREEN);
        } else if (value_pence < 27) {
          draw_bar(bar_x, bar_y, (int)bar_width - 1, bar_height, BAR_COLOR_GREEN);
        } else if (value_pence < 35) {
          draw_bar(bar_x, bar_y, (int)bar_width - 1, bar_height, BAR_COLOR_ORANGE);
        } else if (value_pence < 45) {
          draw_bar(bar_x, bar_y, (int)bar_width - 1, bar_height, BAR_COLOR_RED);
        } else {
          draw_bar(bar_x, bar_y, (int)bar_width - 1, bar_height, BAR_COLOR_DARK_RED);
        }
      }

      // STEP 3b: Draw fixed rate reference line
      double fixed_rate = id(octopus_fixed_rate).state;
      if (!isnan(fixed_rate) && fixed_rate >= display_min && fixed_rate <= display_max) {
        // Calculate y position for the fixed rate
        int fixed_rate_y = graph_y + graph_height - (int)((fixed_rate - display_min) / display_range * graph_height);

        // Draw dashed horizontal line across the graph
        int dash_length = 2;
        int gap_length = 8;

        for (int x = graph_x; x < graph_x + graph_width; x += dash_length + gap_length) {
          int dash_end = x + dash_length;
          if (dash_end > graph_x + graph_width) dash_end = graph_x + graph_width;
          it.line(x, fixed_rate_y, dash_end, fixed_rate_y, COLOR_BLACK);
        }

        // Draw legend label above the line, on the right so it stays clear of the
        // current period marker (on the far left once tomorrow's rates are shown)
        it.printf(graph_x + graph_width - 5, fixed_rate_y - 16, id(font_small), COLOR_TEXT,
                 TextAlign::TOP_RIGHT, "fixed rate");
      }

      // STEP 3c: Mark midnight with a thicker line and the new day's name
      for (int index = 1; index < total_bars; index++) {
        ESPTime local = ESPTime::from_epoch_local(window_start + (time_t)index * slot_seconds);
        if (local.hour != 0 || local.minute != 0) continue;

        int x_pos = graph_x + graph_width * index / total_bars;
        it.filled_rectangle(x_pos - 1, graph_y, 3, graph_height, COLOR_BLACK);

        char day_name[4];
        char day_tag[16];
        local.strftime(day_name, sizeof(day_name), "%a");
        snprintf(day_tag, sizeof(day_tag), "%s %d", day_name, local.day_of_month);

        int tag_x, tag_y, tag_width, tag_height;
        it.get_text_bounds(x_pos + 6, graph_y + 1, day_tag, id(neuebit_bold_regular),
                           TextAlign::TOP_LEFT, &tag_x, &tag_y, &tag_width, &tag_height);
        it.filled_rectangle(x_pos + 2, graph_y, tag_width + 8, tag_height + 2, COLOR_BLACK);
        it.printf(x_pos + 6, graph_y + 1, id(neuebit_bold_regular), COLOR_WHITE,
                 TextAlign::TOP_LEFT, "%s", day_tag);
      }

      // STEP 4: Draw border and frame
      it.rectangle(graph_x - 1, graph_y - 1, graph_width + 2, graph_height + 2, COLOR_BLACK);

      // STEP 5: Add title, current price, and battery
      if (showing_next_day) {
        it.printf(400, 15, id(font_large), COLOR_TEXT, TextAlign::CENTER,
                 "Octopus Energy Rates - Next %dh", (int)((window_end - window_start) / 3600));
      } else {
        it.printf(400, 15, id(font_large), COLOR_TEXT, TextAlign::CENTER,
                 "Octopus Energy Rates - Today");
      }

      // Show current rate in £/kWh
      it.printf(400, 38, id(neuebit_bold_xlarge), COLOR_TEXT, TextAlign::CENTER,
               "Current: £%.4f/kWh", current_rate);

      // Battery percentage with icon in top right
      float battery = id(battery_percent).state;

      // Select battery icon based on percentage
      const char* battery_icon;
      if (battery >= 95) {
        battery_icon = "\U000F0079";  // 100%
      } else if (battery >= 85) {
        battery_icon = "\U000F0082";  // 90%
      } else if (battery >= 75) {
        battery_icon = "\U000F0081";  // 80%
      } else if (battery >= 65) {
        battery_icon = "\U000F0080";  // 70%
      } else if (battery >= 55) {
        battery_icon = "\U000F007F";  // 60%
      } else if (battery >= 45) {
        battery_icon = "\U000F007E";  // 50%
      } else if (battery >= 35) {
        battery_icon = "\U000F007D";  // 40%
      } else if (battery >= 25) {
        battery_icon = "\U000F007C";  // 30%
      } else if (battery >= 15) {
        battery_icon = "\U000F007B";  // 20%
      } else {
        battery_icon = "\U000F007A";  // 10%
      }

      // Draw battery icon and percentage (baseline-aligned, with spacing for 100%)
      it.printf(752, 18, id(font_mdi_large), COLOR_TEXT, TextAlign::BASELINE_RIGHT, "%s", battery_icon);
      it.printf(790, 18, id(neuebit_regular_xlarge), COLOR_TEXT, TextAlign::BASELINE_RIGHT, "%.0f%%", battery);

      // Show sleep-off icon if deep sleep is prevented
      if (id(prevent_deep_sleep)) {
        it.printf(720, 18, id(font_mdi_large), COLOR_TEXT, TextAlign::BASELINE_RIGHT, "\U000F04B3");
      }

      // STEP 6: Legend (7 tiers centered on screen)
      int legend_y = graph_y + graph_height + 30;
      int legend_x = 90;

      // <0p: Teal
      draw_bar(legend_x, legend_y, 20, 15, BAR_COLOR_TEAL);
      it.rectangle(legend_x, legend_y, 20, 15, COLOR_BLACK);
      it.printf(legend_x + 25, legend_y + 2, id(font_small), COLOR_TEXT, "<0p");

      // 0-10p: Light blue
      legend_x += 75;
      draw_bar(legend_x, legend_y, 20, 15, BAR_COLOR_LIGHT_BLUE);
      it.rectangle(legend_x, legend_y, 20, 15, COLOR_BLACK);
      it.printf(legend_x + 25, legend_y + 2, id(font_small), COLOR_TEXT, "0-10p");

      // 10-20p: Light green
      legend_x += 90;
      draw_bar(legend_x, legend_y, 20, 15, BAR_COLOR_LIGHT_GREEN);
      it.rectangle(legend_x, legend_y, 20, 15, COLOR_BLACK);
      it.printf(legend_x + 25, legend_y + 2, id(font_small), COLOR_TEXT, "10-20p");

      // 20-27p: Green
      legend_x += 100;
      draw_bar(legend_x, legend_y, 20, 15, BAR_COLOR_GREEN);
      it.rectangle(legend_x, legend_y, 20, 15, COLOR_BLACK);
      it.printf(legend_x + 25, legend_y + 2, id(font_small), COLOR_TEXT, "20-27p");

      // 27-35p: Orange
      legend_x += 100;
      draw_bar(legend_x, legend_y, 20, 15, BAR_COLOR_ORANGE);
      it.rectangle(legend_x, legend_y, 20, 15, COLOR_BLACK);
      it.printf(legend_x + 25, legend_y + 2, id(font_small), COLOR_TEXT, "27-35p");

      // 35-45p: Red
      legend_x += 100;
      draw_bar(legend_x, legend_y, 20, 15, BAR_COLOR_RED);
      it.rectangle(legend_x, legend_y, 20, 15, COLOR_BLACK);
      it.printf(legend_x + 25, legend_y + 2, id(font_small), COLOR_TEXT, "35-45p");

      // >45p: Dark red
      legend_x += 100;
      draw_bar(legend_x, legend_y, 20, 15, BAR_COLOR_DARK_RED);
      it.rectangle(legend_x, legend_y, 20, 15, COLOR_BLACK);
      it.printf(legend_x + 25, legend_y + 2, id(font_small), COLOR_TEXT, ">45p");

      // STEP 7: Show time of last update in top left
      it.printf(10, 18, id(neuebit_regular_xlarge), COLOR_TEXT, TextAlign::BASELINE, "Last updated @ %02d:%02d", current_hour, current_minute);

