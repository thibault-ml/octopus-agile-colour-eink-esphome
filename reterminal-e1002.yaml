esphome:
  name: reterminal-e1002
  friendly_name: reTerminal_E1002
  on_boot:
    - priority: 600
      then:
        - output.turn_on: bsp_battery_enable
        - delay: 200ms
        - component.update: battery_voltage
        - component.update: battery_percent
    - priority: -100  # Run after everything else is initialized
      then:
        - logger.log:
            tag: "on_boot"
            format: "Boot finished. Will sleep in 1 minute"
        - delay: 1min
        - script.execute: enter_deep_sleep_until_next_wakeup

esp32:
  board: esp32-s3-devkitc-1
  cpu_frequency: 160MHz
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

# Enable logging
logger:

# Enable JSON
json:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key
  on_client_connected:
    - logger.log:
        level: info
        tag: "api"
        format: "Client %s connected to API with IP %s"
        args: ["client_info.c_str()", "client_address.c_str()"]
    - wait_until:
        timeout: 30s
        condition:
          lambda: |-
            if (isnan(id(octopus_current_rate).state) || id(octopus_rates).state.empty() ||
                id(octopus_next_rates).state.empty()) {
              return false;
            }
            float current_rate = id(octopus_current_rate).state;
            float last_rate = id(last_current_rate);
            size_t current_hash = std::hash<std::string>{}(id(octopus_rates).state);
            size_t last_hash = id(last_rates_json_hash);
            size_t next_hash = std::hash<std::string>{}(id(octopus_next_rates).state);
            size_t last_next_hash = id(last_next_rates_json_hash);
            const float epsilon = 0.00001;

            return std::abs(current_rate - last_rate) > epsilon || current_hash != last_hash ||
                   next_hash != last_next_hash;
    - lambda: |-
        float current_rate = id(octopus_current_rate).state;
        float last_rate = id(last_current_rate);
        size_t current_hash = std::hash<std::string>{}(id(octopus_rates).state);
        size_t last_hash = id(last_rates_json_hash);
        size_t next_hash = std::hash<std::string>{}(id(octopus_next_rates).state);
        size_t last_next_hash = id(last_next_rates_json_hash);
        const float epsilon = 0.00001;

        if (std::abs(current_rate - last_rate) > epsilon || current_hash != last_hash ||
            next_hash != last_next_hash) {
          if (std::abs(current_rate - last_rate) > epsilon) {
            ESP_LOGD("api", "--> Current rate data changed");
            ESP_LOGD("api", "    last rate: %.4f", last_rate);
            ESP_LOGD("api", "     new rate: %.4f", current_rate);
          }
          if (current_hash != last_hash) {
            ESP_LOGD("api", "--> rates json changed");
            ESP_LOGD("api", "    last hash: %zu", last_hash);
            ESP_LOGD("api", "     new hash: %zu", current_hash);
          }
          if (next_hash != last_next_hash) {
            ESP_LOGD("api", "--> next day rates json changed");
            ESP_LOGD("api", "    last hash: %zu", last_next_hash);
            ESP_LOGD("api", "     new hash: %zu", next_hash);
          }
          ESP_LOGI("api", "Sensor data has changed, updating display");
          id(last_current_rate) = current_rate;
          id(last_rates_json_hash) = current_hash;
          id(last_next_rates_json_hash) = next_hash;
          id(epaper_display).update();
        } else {
          ESP_LOGI("api", "Sensor data unchanged, skipping display update");
        }

ota:
